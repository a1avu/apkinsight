<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APKInsight</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --border-bright: #333333;
      --accent: #00ff88;
      --accent-dim: #00ff8822;
      --accent-mid: #00ff8844;
      --warn: #ff6b35;
      --warn-dim: #ff6b3522;
      --text: #e8e8e8;
      --text-dim: #666666;
      --text-mid: #999999;
      --high: #ff4444;
      --med: #ffaa00;
      --low: #44aaff;

      --sidebar-width: 280px;
      --sidebar-collapsed: 40px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* ===================== LAYOUT ===================== */
    .layout {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
    }

    /* 사이드바 헤더 */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 52px;
    }

    .sidebar-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity 0.15s;
    }

    .sidebar.collapsed .sidebar-title {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-toggle {
      background: none;
      border: 1px solid var(--border-bright);
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      line-height: 1;
    }

    .sidebar-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 새로고침 버튼 */
    .sidebar-refresh {
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: color 0.2s;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .sidebar-refresh:hover { color: var(--accent); }

    .sidebar.collapsed .sidebar-refresh span { display: none; }
    .sidebar.collapsed .sidebar-refresh { justify-content: center; padding: 6px; }

    /* 리스트 영역 */
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar.collapsed .sidebar-list { overflow: hidden; }

    .sidebar-list::-webkit-scrollbar { width: 3px; }
    .sidebar-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    /* 빈 상태 */
    .sidebar-empty {
      padding: 24px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
    }

    /* APK 아이템 */
    .apk-item {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .apk-item:hover { background: #161616; }

    .apk-item-main {
      padding: 10px 14px;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
    }

    .apk-item-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .apk-item-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .apk-item-pkg {
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .apk-item-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #444;
    }

    /* 액션 버튼 */
    .apk-item-actions {
      display: flex;
      gap: 6px;
      padding: 0 14px 10px;
    }

    .apk-btn {
      flex: 1;
      background: none;
      border: 1px solid var(--border-bright);
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 5px 8px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      text-align: center;
    }

    .apk-btn.view:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .apk-btn.del:hover {
      border-color: var(--high);
      color: var(--high);
      background: #ff444411;
    }

    .sidebar.collapsed .apk-item-main,
    .sidebar.collapsed .apk-item-actions,
    .sidebar.collapsed .sidebar-empty { display: none; }

    /* ===================== MAIN ===================== */
    .main {
      flex: 1;
      min-width: 0;
      padding: 40px 24px 80px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* header */
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* upload zone */
    .upload-zone {
      border: 1px dashed var(--border-bright);
      border-radius: 4px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-mid);
    }

    .upload-filename {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      margin-top: 8px;
      display: none;
    }

    /* controls row */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .field label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    select, input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border-bright);
      color: var(--text);
      padding: 10px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    select:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    select option { background: #111; }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 24px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      white-space: nowrap;
      transition: all 0.2s;
      align-self: flex-end;
    }

    .btn:hover { background: #00ffaa; }
    .btn:disabled {
      background: var(--border-bright);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* ── 8주차: 위험 점수 게이지 ──────────────────────────── */
    .risk-gauge-wrap {
      margin-top: 16px;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .risk-gauge-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .risk-gauge-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .risk-gauge-score {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
    }
    .risk-gauge-score.score-high   { color: var(--high); }
    .risk-gauge-score.score-medium { color: var(--med); }
    .risk-gauge-score.score-low    { color: var(--low); }
    .risk-gauge-score.score-safe   { color: var(--accent); }
    .risk-gauge-track {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .risk-gauge-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .risk-gauge-fill.score-high   { background: var(--high); }
    .risk-gauge-fill.score-medium { background: var(--med); }
    .risk-gauge-fill.score-low    { background: var(--low); }
    .risk-gauge-fill.score-safe   { background: var(--accent); }
    .risk-gauge-chips {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .risk-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .risk-chip-H { background: #ff444422; color: var(--high); border: 1px solid #ff444444; }
    .risk-chip-M { background: #ffaa0022; color: var(--med);  border: 1px solid #ffaa0044; }
    .risk-chip-L { background: #44aaff22; color: var(--low);  border: 1px solid #44aaff44; }

    /* ── 8주차: 분석 진행도 바 ───────────────────────────── */
    .progress-wrap {
      margin-top: 12px;
    }
    .progress-steps {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }
    .progress-step {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      transition: background 0.4s;
    }
    .progress-step.done    { background: var(--accent); }
    .progress-step.active  { background: var(--accent); opacity: 0.5; animation: pulse 1s infinite; }
    .progress-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
    }

    /* ── 8주차: 사이드바 risk 뱃지 ──────────────────────── */
    .apk-item-risk {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 2px;
      margin-top: 4px;
      display: inline-block;
    }
    .apk-item-risk.r-high   { background: #ff444422; color: var(--high); border: 1px solid #ff444444; }
    .apk-item-risk.r-medium { background: #ffaa0022; color: var(--med);  border: 1px solid #ffaa0044; }
    .apk-item-risk.r-low    { background: #44aaff22; color: var(--low);  border: 1px solid #44aaff44; }
    .apk-item-risk.r-safe   { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-mid); }

    /* status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-top: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .status-dot.idle { background: var(--text-dim); }
    .status-dot.running { background: var(--accent); animation: pulse 1s infinite; }
    .status-dot.done { background: var(--accent); }
    .status-dot.error { background: var(--high); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text-mid);
      flex: 1;
    }

    .status-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 2px;
      letter-spacing: 1px;
    }

    .status-badge.idle { background: var(--border); color: var(--text-dim); }
    .status-badge.running { background: var(--accent-mid); color: var(--accent); }
    .status-badge.done { background: var(--accent-mid); color: var(--accent); }
    .status-badge.error { background: var(--warn-dim); color: var(--warn); }

    /* log */
    .log-box {
      background: #050505;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
      color: var(--text-dim);
      min-height: 100px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .log-box .log-time { color: #333; }
    .log-box .log-ok { color: var(--accent); }
    .log-box .log-err { color: var(--high); }
    .log-box .log-info { color: var(--text-mid); }

    /* result */
    .result-empty {
      text-align: center;
      padding: 48px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .summary-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .summary-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .summary-chip span { color: var(--text-dim); }
    .summary-chip strong { color: var(--accent); margin-left: 6px; }

    /* finding item */
    .finding {
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .finding-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      background: var(--bg);
      user-select: none;
    }

    .finding-header:hover { background: #0f0f0f; }

    .risk-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .risk-HIGH { background: #ff444422; color: var(--high); border: 1px solid #ff444444; }
    .risk-MEDIUM { background: #ffaa0022; color: var(--med); border: 1px solid #ffaa0044; }
    .risk-LOW { background: #44aaff22; color: var(--low); border: 1px solid #44aaff44; }

    .finding-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .finding-toggle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .finding-body {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: none;
    }

    .finding-body.open { display: block; }

    .kv { margin-bottom: 10px; }
    .kv-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .kv-value {
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.5;
    }

    .kv-code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      color: #aaa;
      overflow-x: auto;
      white-space: pre;
    }

    .section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-count {
      background: var(--border);
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11px;
      color: var(--text-mid);
    }

    /* ===================== LIB TABLE ===================== */
    .lib-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .lib-tab {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 5px 14px;
      border-radius: 3px;
      border: 1px solid var(--border-bright);
      background: none;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .lib-tab.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .lib-table-wrap {
      overflow-x: auto;
    }

    .lib-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
    }

    .lib-table th {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-bright);
      color: var(--text-dim);
      letter-spacing: 1px;
      font-weight: 500;
      white-space: nowrap;
    }

    .lib-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-mid);
      vertical-align: top;
    }

    .lib-table tr:hover td { background: #161616; }

    .lib-ver-ok {
      color: var(--accent);
      font-weight: 500;
    }

    .lib-ver-none {
      color: #444;
    }

    .lib-cve-badge {
      display: inline-block;
      background: #ff444422;
      border: 1px solid #ff444444;
      color: var(--high);
      padding: 1px 7px;
      border-radius: 2px;
      font-size: 10px;
      white-space: nowrap;
    }

    .lib-warn-badge {
      display: inline-block;
      background: #ffaa0022;
      border: 1px solid #ffaa0044;
      color: var(--med);
      padding: 1px 7px;
      border-radius: 2px;
      font-size: 10px;
      white-space: nowrap;
    }

    .lib-panel { display: none; }
    .lib-panel.active { display: block; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    /* ===================== CONFIRM MODAL ===================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      padding: 28px 28px 22px;
      width: 340px;
      max-width: calc(100vw - 48px);
    }

    .modal-icon {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      color: var(--high);
      margin-bottom: 12px;
    }

    .modal-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .modal-body {
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .modal-target {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--high);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 8px 18px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid;
    }

    .modal-btn.cancel {
      background: none;
      border-color: var(--border-bright);
      color: var(--text-dim);
    }

    .modal-btn.cancel:hover {
      border-color: var(--text-mid);
      color: var(--text);
    }

    .modal-btn.confirm-del {
      background: #ff444411;
      border-color: var(--high);
      color: var(--high);
    }

    .modal-btn.confirm-del:hover {
      background: #ff444430;
    }

    /* 사이드바에서 DB 결과 로드할 때 메인에 표시 */
    .card-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-label-row .card-label { margin-bottom: 0; }

    .result-from-db {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 1px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<!-- 삭제 확인 모달 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-icon">[!]</div>
    <div class="modal-title">분석 기록 삭제</div>
    <div class="modal-body">
      아래 분석 기록을 영구적으로 삭제합니다.<br>
      이 작업은 되돌릴 수 없습니다.<br><br>
      <span class="modal-target" id="modalTargetName"></span>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">취소</button>
      <button class="modal-btn confirm-del" id="modalConfirm">삭제</button>
    </div>
  </div>
</div>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">분석 기록</span>
      <button class="sidebar-toggle" id="sidebarToggle" title="사이드바 토글">◀</button>
    </div>
    <button class="sidebar-refresh" id="sidebarRefresh" title="목록 새로고침">
      <span style="font-size:13px">↻</span>
      <span>새로고침</span>
    </button>
    <div class="sidebar-list" id="sidebarList">
      <div class="sidebar-empty">// 로딩 중...</div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main">
    <header>
      <div>
        <div class="logo">APKInsight</div>
        <div class="logo-sub">Android Static Analysis</div>
      </div>
    </header>

    <!-- upload card -->
    <div class="card">
      <div class="card-label">01 — 파일 업로드</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="apkFile" accept=".apk" />
        <div class="upload-icon">[↑]</div>
        <div class="upload-text">APK 파일을 드래그하거나 클릭하세요</div>
        <div class="upload-filename" id="uploadFilename"></div>
      </div>

      <div class="controls">
        <div class="field">
          <label>LLM Provider</label>
          <select id="llmProvider">
            <option value="ollama">Ollama (로컬)</option>
            <option value="gemini">Gemini</option>
          </select>
        </div>
        <div class="field">
          <label id="apiKeyLabel">API Key</label>
          <input type="password" id="apiKeyInput" placeholder="API Key" />
        </div>
        <button class="btn" id="analyzeBtn">RUN</button>
      </div>

      <div class="status-bar" id="statusBar">
        <div class="status-dot idle" id="statusDot"></div>
        <div class="status-text" id="statusText">대기 중</div>
        <div class="status-badge idle" id="statusBadge">IDLE</div>
      </div>

      <!-- 8주차: 분석 진행도 바 -->
      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-steps" id="progressSteps">
          <div class="progress-step" data-step="0"></div>
          <div class="progress-step" data-step="1"></div>
          <div class="progress-step" data-step="2"></div>
          <div class="progress-step" data-step="3"></div>
          <div class="progress-step" data-step="4"></div>
          <div class="progress-step" data-step="5"></div>
          <div class="progress-step" data-step="6"></div>
        </div>
        <div class="progress-label" id="progressLabel">0 / 7 단계</div>
      </div>
    </div>

    <!-- log card -->
    <div class="card">
      <div class="card-label">02 — 진행 로그</div>
      <div class="log-box" id="logBox"></div>
    </div>

    <!-- result card -->
    <div class="card">
      <div class="card-label-row">
        <div class="card-label">03 — 분석 결과</div>
        <div class="result-from-db" id="resultSourceTag"></div>
      </div>
      <div id="resultArea">
        <div class="result-empty">// 아직 결과가 없습니다</div>
      </div>
    </div>

    <!-- lib/cve card -->
    <div class="card" id="libCard" style="display:none">
      <div class="card-label">04 — 라이브러리 / CVE</div>
      <div class="lib-tabs">
        <button class="lib-tab active" id="tabLibAll">전체</button>
        <button class="lib-tab" id="tabLibVer">버전 확인</button>
        <button class="lib-tab" id="tabLibCve">CVE 발견</button>
        <button class="lib-tab" id="tabLibWarn">버전 미확인 경고</button>
      </div>

      <!-- 전체 패널 -->
      <div class="lib-panel active" id="panelLibAll">
        <div class="lib-table-wrap">
          <table class="lib-table" id="tableLibAll">
            <thead><tr>
              <th>라이브러리</th><th>버전</th><th>타입</th><th>소스</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 버전 확인 패널 -->
      <div class="lib-panel" id="panelLibVer">
        <div class="lib-table-wrap">
          <table class="lib-table" id="tableLibVer">
            <thead><tr>
              <th>라이브러리</th><th>버전</th><th>소스</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- CVE 패널 -->
      <div class="lib-panel" id="panelLibCve">
        <div class="lib-table-wrap">
          <table class="lib-table" id="tableLibCve">
            <thead><tr>
              <th>라이브러리</th><th>버전</th><th>CVE ID</th><th>심각도</th><th>요약</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 버전 미확인 경고 패널 -->
      <div class="lib-panel" id="panelLibWarn">
        <div class="lib-table-wrap">
          <table class="lib-table" id="tableLibWarn">
            <thead><tr>
              <th>라이브러리</th><th>CVE 수</th><th>최신 fix</th><th>관련 ID</th><th>요약</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const API_BASE = "http://localhost:8000";

  // ─── DOM refs ───────────────────────────────────────────
  const apkFile        = document.getElementById("apkFile");
  const uploadZone     = document.getElementById("uploadZone");
  const uploadFilename = document.getElementById("uploadFilename");
  const llmProvider    = document.getElementById("llmProvider");
  const apiKeyInput    = document.getElementById("apiKeyInput");
  const apiKeyLabel    = document.getElementById("apiKeyLabel");
  const analyzeBtn     = document.getElementById("analyzeBtn");
  const statusDot      = document.getElementById("statusDot");
  const statusText     = document.getElementById("statusText");
  const statusBadge    = document.getElementById("statusBadge");
  const logBox         = document.getElementById("logBox");
  const resultArea     = document.getElementById("resultArea");
  const resultSourceTag = document.getElementById("resultSourceTag");

  const sidebar        = document.getElementById("sidebar");
  const sidebarToggle  = document.getElementById("sidebarToggle");
  const sidebarRefresh = document.getElementById("sidebarRefresh");
  const sidebarList    = document.getElementById("sidebarList");

  const modalBackdrop  = document.getElementById("modalBackdrop");
  const modalCancel    = document.getElementById("modalCancel");
  const modalConfirm   = document.getElementById("modalConfirm");
  const modalTargetName = document.getElementById("modalTargetName");

  // ─── Sidebar toggle ─────────────────────────────────────
  let sidebarCollapsed = false;

  sidebarToggle.addEventListener("click", () => {
    sidebarCollapsed = !sidebarCollapsed;
    sidebar.classList.toggle("collapsed", sidebarCollapsed);
    sidebarToggle.textContent = sidebarCollapsed ? "▶" : "◀";
  });

  // ─── Sidebar: APK 목록 로드 ──────────────────────────────
  async function loadAnalysisList() {
    sidebarList.innerHTML = '<div class="sidebar-empty">// 로딩 중...</div>';
    try {
      const res = await fetch(`${API_BASE}/analysis/list`);
      const list = await res.json();

      if (!Array.isArray(list) || list.length === 0) {
        sidebarList.innerHTML = '<div class="sidebar-empty">// 분석 기록 없음</div>';
        return;
      }

      sidebarList.innerHTML = "";
      list.forEach(item => {
        const div = document.createElement("div");
        div.className = "apk-item";

        const dateStr = item.created_at
          ? new Date(item.created_at).toLocaleString("ko-KR", {
              year: "2-digit", month: "2-digit", day: "2-digit",
              hour: "2-digit", minute: "2-digit"
            })
          : "-";

        div.innerHTML = `
          <div class="apk-item-main">
            <div class="apk-item-id">#${item.id}</div>
            <div class="apk-item-name" title="${esc(item.apk_name || '')}">${esc(item.apk_name || "unknown")}</div>
            <div class="apk-item-pkg" title="${esc(item.package_name || '')}">${esc(item.package_name || "—")}</div>
            <div class="apk-item-date">${dateStr}</div>
            ${riskBadge(item)}
          </div>
          <div class="apk-item-actions">
            <button class="apk-btn view" data-id="${item.id}">조회</button>
            <button class="apk-btn del" data-id="${item.id}" data-name="${esc(item.apk_name || item.id)}">삭제</button>
          </div>
        `;

        div.querySelector(".apk-btn.view").addEventListener("click", () => {
          viewAnalysis(item.id, item.apk_name);
        });

        div.querySelector(".apk-btn.del").addEventListener("click", () => {
          openDeleteModal(item.id, item.apk_name);
        });

        sidebarList.appendChild(div);
      });
    } catch (e) {
      sidebarList.innerHTML = `<div class="sidebar-empty">// 로드 실패</div>`;
    }
  }

  sidebarRefresh.addEventListener("click", loadAnalysisList);

  // ─── 사이드바: DB 결과 조회 ──────────────────────────────
  async function viewAnalysis(id, name) {
    resultSourceTag.textContent = "";
    resultArea.innerHTML = '<div class="result-empty">// 불러오는 중...</div>';

    // 메인 스크롤로 이동
    document.querySelector(".main").scrollIntoView({ behavior: "smooth" });

    try {
      const res = await fetch(`${API_BASE}/analysis/${id}`);
      const data = await res.json();

      if (data.error) {
        resultArea.innerHTML = `<div class="result-empty">// 오류: ${esc(data.error)}</div>`;
        return;
      }

      // DB 결과를 renderResult 형식으로 변환
      // analysis_result 행들을 source 기준으로 분류
      const custom = [];
      const third_party = [];
      (data.results || []).forEach(r => {
        const entry = {
          category: r.category,
          cwe: r.cwe,
          owasp: r.owasp,
          file_path: r.file_path,
          line: r.line,
          code: r.code,
          risk: r.risk,
          explanation: r.explanation,
          fix: r.fix
        };
        if (r.is_third_party) {
          third_party.push(entry);
        } else {
          custom.push(entry);
        }
      });

      const payload = {
        apk_name: data.apk_name,
        risk_score:  data.risk_score  ?? null,
        risk_high:   data.risk_high   ?? null,
        risk_medium: data.risk_medium ?? null,
        risk_low:    data.risk_low    ?? null,
        data: { custom, third_party }
      };

      resultSourceTag.textContent = `DB #${id}`;
      renderResult(payload);

      // libs/osv 파일에서 읽어서 라이브러리 카드 업데이트
      try {
        const osvRes = await fetch(`${API_BASE}/analysis/${id}/osv`);
        const osvData = await osvRes.json();
        renderLibs(osvData.libs, osvData.osv);
      } catch (_) {
        renderLibs([], {});
      }

      log(`DB 기록 #${id} 로드 완료: ${name}`, "ok");
    } catch (e) {
      resultArea.innerHTML = `<div class="result-empty">// 불러오기 실패: ${esc(e.message)}</div>`;
      log(`DB 조회 실패: ${e.message}`, "err");
    }
  }

  // ─── 삭제 모달 ────────────────────────────────────────────
  let pendingDeleteId = null;

  function openDeleteModal(id, name) {
    pendingDeleteId = id;
    modalTargetName.textContent = `#${id}  ${name}`;
    modalBackdrop.classList.add("open");
  }

  function closeModal() {
    pendingDeleteId = null;
    modalBackdrop.classList.remove("open");
  }

  modalCancel.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", e => {
    if (e.target === modalBackdrop) closeModal();
  });

  modalConfirm.addEventListener("click", async () => {
    if (pendingDeleteId === null) return;
    const id = pendingDeleteId;
    closeModal();

    try {
      const res = await fetch(`${API_BASE}/analysis/${id}`, { method: "DELETE" });
      if (res.ok) {
        log(`분석 #${id} 삭제 완료`, "ok");
        await loadAnalysisList();
        // 현재 보여주는 결과가 삭제된 항목이면 초기화
        if (resultSourceTag.textContent === `DB #${id}`) {
          resultSourceTag.textContent = "";
          resultArea.innerHTML = '<div class="result-empty">// 삭제된 기록입니다</div>';
        }
      } else {
        const data = await res.json().catch(() => ({}));
        log(`삭제 실패: ${data.error || res.status}`, "err");
      }
    } catch (e) {
      log(`삭제 요청 실패: ${e.message}`, "err");
    }
  });

  // ─── 라이브러리 / CVE 렌더링 ────────────────────────────
  const libCard    = document.getElementById("libCard");
  const tabLibAll  = document.getElementById("tabLibAll");
  const tabLibVer  = document.getElementById("tabLibVer");
  const tabLibCve  = document.getElementById("tabLibCve");
  const tabLibWarn = document.getElementById("tabLibWarn");

  const tabs = [
    { btn: tabLibAll,  panel: document.getElementById("panelLibAll") },
    { btn: tabLibVer,  panel: document.getElementById("panelLibVer") },
    { btn: tabLibCve,  panel: document.getElementById("panelLibCve") },
    { btn: tabLibWarn, panel: document.getElementById("panelLibWarn") },
  ];

  tabs.forEach(({ btn, panel }) => {
    btn.addEventListener("click", () => {
      tabs.forEach(t => { t.btn.classList.remove("active"); t.panel.classList.remove("active"); });
      btn.classList.add("active");
      panel.classList.add("active");
    });
  });

  function renderLibs(libs, osv) {
    if (!libs || !libs.length) { libCard.style.display = "none"; return; }
    libCard.style.display = "block";

    const findings = osv?.findings || [];
    const warnings = osv?.warnings || [];

    // CVE 맵: "group:artifact@version" → finding[]
    const cveMap = {};
    findings.forEach(f => {
      const k = `${f.library}@${f.version}`;
      if (!cveMap[k]) cveMap[k] = [];
      cveMap[k].push(f);
    });

    // 전체 탭
    const tbAll = document.querySelector("#tableLibAll tbody");
    tbAll.innerHTML = libs.map(l => {
      const key = `${l.group}:${l.artifact}@${l.version}`;
      const cves = cveMap[key] || [];
      const verCell = l.version
        ? `<span class="lib-ver-ok">${esc(l.version)}</span>`
        : `<span class="lib-ver-none">—</span>`;
      const cveCell = cves.length
        ? `<span class="lib-cve-badge">CVE ×${cves.length}</span>`
        : "";
      return `<tr>
        <td>${esc(l.group ? l.group+":"+l.artifact : l.name)}</td>
        <td>${verCell} ${cveCell}</td>
        <td style="color:#444">${esc(l.type||"")}</td>
        <td style="color:#333;font-size:10px">${esc((l.version_source||"").split("/").pop())}</td>
      </tr>`;
    }).join("");

    // 버전 확인 탭
    const tbVer = document.querySelector("#tableLibVer tbody");
    const withVer = libs.filter(l => l.version);
    tbVer.innerHTML = withVer.length ? withVer.map(l => `<tr>
      <td>${esc(l.group ? l.group+":"+l.artifact : l.name)}</td>
      <td class="lib-ver-ok">${esc(l.version)}</td>
      <td style="color:#333;font-size:10px">${esc(l.version_source||"")}</td>
    </tr>`).join("") : `<tr><td colspan="3" style="color:#444;text-align:center;padding:20px">// 없음</td></tr>`;

    // CVE 탭
    const tbCve = document.querySelector("#tableLibCve tbody");
    tbCve.innerHTML = findings.length ? findings.map(f => {
      const cves = (f.aliases||[]).filter(a => a.startsWith("CVE-")).join(", ") || f.vuln_id;
      const desc = f.summary_ko || f.summary || "";
      return `<tr>
        <td>${esc(f.library)}</td>
        <td class="lib-ver-ok">${esc(f.version)}</td>
        <td><span class="lib-cve-badge">${esc(cves)}</span></td>
        <td style="font-size:10px;color:#aaa">${esc(f.severity||"")}</td>
        <td style="font-size:10px;color:#bbb">${esc(desc.slice(0,80))}${desc.length>80?"…":""}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="5" style="color:#444;text-align:center;padding:20px">// CVE 없음</td></tr>`;

    // 버전 미확인 경고 탭
    const tbWarn = document.querySelector("#tableLibWarn tbody");
    tbWarn.innerHTML = warnings.length ? warnings.map(w => {
      const desc = (w.summaries_ko || []).join(" / ").slice(0, 100);
      return `<tr>
        <td>${esc(w.library)}</td>
        <td><span class="lib-warn-badge">×${w.vuln_count}</span></td>
        <td style="color:#aaa">${esc(w.latest_fix||"불명")}</td>
        <td style="font-size:10px;color:#555">${(w.vuln_ids||[]).slice(0,3).map(esc).join(", ")}${(w.vuln_ids||[]).length>3?"…":""}</td>
        <td style="font-size:10px;color:#bbb">${esc(desc)}${desc.length>=100?"…":""}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="5" style="color:#444;text-align:center;padding:20px">// 없음</td></tr>`;

    // 탭 카운트 업데이트
    tabLibAll.textContent  = `전체 (${libs.length})`;
    tabLibVer.textContent  = `버전 확인 (${withVer.length})`;
    tabLibCve.textContent  = `CVE 발견 (${findings.length})`;
    tabLibWarn.textContent = `버전 미확인 경고 (${warnings.length})`;
  }

  // ─── 기존 분석 로직 ──────────────────────────────────────
  const statusTextMap = {
    idle:              "대기 중",
    queing_jadx:       "JADX 디컴파일 중",
    queing_lib_detect: "라이브러리 버전 탐지 중",
    queing_osv:        "OSV CVE 조회 중",
    queing_mobfscan:   "MobSFScan 실행 중",
    queing_custom_grep:"Custom Grep 실행 중",
    queing_merge:      "결과 병합 중",
    queing_AI:         "AI 분석 중",
    queing_finalize:   "결과 정리 중",
    done:              "완료",
    error:             "오류 발생"
  };

  // 8주차: 단계별 진행도 매핑 (0-based, 7단계 총)
  const statusStepMap = {
    idle:              -1,
    queing_jadx:        0,
    queing_lib_detect:  1,
    queing_osv:         2,
    queing_mobfscan:    3,
    queing_custom_grep: 4,
    queing_merge:       5,
    queing_AI:          6,
    done:               7,
  };

  function updateProgress(statusKey) {
    const step = statusStepMap[statusKey];
    if (step === undefined || step < 0) {
      progressWrap.style.display = "none";
      return;
    }
    progressWrap.style.display = "block";
    const steps = progressSteps.querySelectorAll(".progress-step");
    steps.forEach((el, i) => {
      el.classList.remove("done", "active");
      if (i < step) el.classList.add("done");
      else if (i === step && step < 7) el.classList.add("active");
      else if (step >= 7) el.classList.add("done");
    });
    progressLabel.textContent = step >= 7
      ? "7 / 7 단계 — 완료"
      : `${step + 1} / 7 단계 — ${statusTextMap[statusKey] || statusKey}`;
  }

  let pollingTimer   = null;
  let currentStatus  = "idle";
  let hasFetchedResult = false;
  let prevMessage    = "";

  // drag & drop
  uploadZone.addEventListener("dragover", e => { e.preventDefault(); uploadZone.classList.add("drag"); });
  uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("drag"));
  uploadZone.addEventListener("drop", e => {
    e.preventDefault();
    uploadZone.classList.remove("drag");
    if (e.dataTransfer.files[0]) {
      apkFile.files = e.dataTransfer.files;
      showFilename(e.dataTransfer.files[0].name);
    }
  });

  apkFile.addEventListener("change", () => {
    if (apkFile.files[0]) showFilename(apkFile.files[0].name);
  });

  function showFilename(name) {
    uploadFilename.textContent = name;
    uploadFilename.style.display = "block";
  }

  llmProvider.addEventListener("change", () => {
    apiKeyLabel.textContent = llmProvider.value === "gemini" ? "Gemini API Key" : "Ollama API Key";
    apiKeyInput.value = "";
    apiKeyInput.placeholder = llmProvider.value === "gemini" ? "AIza..." : "API Key";
  });

  function log(msg, type = "info") {
    const now = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    const span = document.createElement("span");
    span.className = `log-${type}`;
    span.textContent = `[${now}] ${msg}\n`;
    logBox.appendChild(span);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function setStatus(s, msg) {
    currentStatus = s;
    const label = statusTextMap[s] || s;
    statusText.textContent = msg || label;
    statusBadge.textContent = s.toUpperCase();
    ["idle","running","done","error"].forEach(c => {
      statusDot.classList.remove(c);
      statusBadge.classList.remove(c);
    });
    const cls = (s === "idle" || s === "done") ? s : (s === "error" ? "error" : "running");
    statusDot.classList.add(cls);
    statusBadge.classList.add(cls);
    // 8주차: 진행도 바 업데이트
    updateProgress(s);
  }

  function setLocked(v) {
    apkFile.disabled    = v;
    llmProvider.disabled = v;
    apiKeyInput.disabled = v;
    analyzeBtn.disabled  = v;
  }

  async function fetchStatus() {
    try {
      const res  = await fetch(`${API_BASE}/status`);
      const data = await res.json();
      const next = data.status || "idle";
      const msg  = data.message || "";

      if (msg && msg !== prevMessage) {
        prevMessage = msg;
        const type = msg.includes("실패") || msg.includes("오류") ? "err" : "ok";
        log(msg, type);
      }

      if (next !== currentStatus) {
        const label = statusTextMap[next] || next;
        log(`상태: ${label}`, next === "error" ? "err" : "info");
        setStatus(next, msg || label);
      }

      if (next === "done" && !hasFetchedResult) {
        hasFetchedResult = true;
        await fetchResult();
        stopPolling();
        setLocked(false);
        // 분석 완료 후 사이드바 자동 갱신
        await loadAnalysisList();
      }

      if (next === "error") { stopPolling(); setLocked(false); }
      if (next === "idle")  setLocked(false);

    } catch (e) {
      log(`연결 실패: ${e.message}`, "err");
      stopPolling();
      setLocked(false);
      setStatus("error");
    }
  }

  async function fetchResult() {
    try {
      const res  = await fetch(`${API_BASE}/result`);
      const data = await res.json();
      resultSourceTag.textContent = "";
      renderResult(data);
      renderLibs(data?.libs, data?.osv);
      log("결과 로드 완료", "ok");
      setStatus("idle");
    } catch (e) {
      log(`결과 조회 실패: ${e.message}`, "err");
    }
  }

  function startPolling() {
    stopPolling();
    pollingTimer = setInterval(fetchStatus, 1500);
  }

  function stopPolling() {
    if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
  }

  analyzeBtn.addEventListener("click", async () => {
    const file = apkFile.files[0];
    if (!file) { log("APK 파일을 선택하세요", "err"); return; }

    logBox.innerHTML = "";
    resultArea.innerHTML = '<div class="result-empty">// 분석 진행 중...</div>';
    resultSourceTag.textContent = "";
    setLocked(true);
    hasFetchedResult = false;
    prevMessage = "";
    setStatus("running");
    log(`업로드: ${file.name}`, "info");

    const formData = new FormData();
    formData.append("file", file);
    formData.append("llm_provider", llmProvider.value);
    formData.append("api_key", apiKeyInput.value.trim());

    try {
      const res  = await fetch(`${API_BASE}/analyze`, { method: "POST", body: formData });
      const data = await res.json();
      if (!res.ok || data.error) {
        log(`시작 실패: ${data.error || "알 수 없는 오류"}`, "err");
        setLocked(false); setStatus("error"); return;
      }
      log(`분석 시작: ${data.fileName}`, "ok");
      startPolling();
      await fetchStatus();
    } catch (e) {
      log(`요청 실패: ${e.message}`, "err");
      setLocked(false); setStatus("error");
    }
  });

  // ─── 렌더링 ──────────────────────────────────────────────
  function renderResult(result) {
    if (!result || !result.data) {
      resultArea.innerHTML = '<div class="result-empty">// 결과 데이터 없음</div>';
      return;
    }

    const custom = result.data.custom      ?? [];
    const tp     = result.data.third_party ?? [];

    let html = `<div class="summary-row">
      <div class="summary-chip"><span>APK</span><strong>${esc(result.apk_name || "-")}</strong></div>
      <div class="summary-chip"><span>자체 코드</span><strong>${custom.length}건</strong></div>
    </div>
    ${renderRiskGauge(result)}`;

    html += renderSection("자체 코드 결과", custom);
    resultArea.innerHTML = html;

    resultArea.querySelectorAll(".finding-header").forEach(h => {
      h.addEventListener("click", () => {
        const body = h.nextElementSibling;
        const tog  = h.querySelector(".finding-toggle");
        body.classList.toggle("open");
        tog.textContent = body.classList.contains("open") ? "−" : "+";
      });
    });
  }

  function renderSection(title, items) {
    if (!items.length) return `
      <div class="section-title">${esc(title)}<span class="section-count">0</span></div>
      <div class="result-empty" style="padding:24px">// 비어 있음</div>`;
    return `<div class="section-title">${esc(title)}<span class="section-count">${items.length}</span></div>
      ${items.map(renderFinding).join("")}`;
  }

  function renderFinding(item) {
    const risk  = item.risk  || "LOW";
    const cat   = item.category || item.rule || "unknown";
    const file  = item.file_path || item.file || "";
    const line  = item.line  || "";
    const code  = item.code  || "";
    const exp   = item.explanation || item.message || item.description || "";
    const cwe   = item.cwe   || "";
    const owasp = item.owasp || "";

    const fix   = item.fix   || "";

    return `<div class="finding">
      <div class="finding-header">
        <span class="risk-tag risk-${risk}">${risk}</span>
        <span class="finding-title">${esc(cat)}</span>
        <span class="finding-toggle">+</span>
      </div>
      <div class="finding-body">
        ${exp  ? `<div class="kv"><div class="kv-label">설명</div><div class="kv-value">${esc(exp)}</div></div>` : ""}
        ${file ? `<div class="kv"><div class="kv-label">파일</div><div class="kv-value" style="font-family:monospace;font-size:12px">${esc(file)}${line ? ` : ${esc(line)}` : ""}</div></div>` : ""}
        ${code ? `<div class="kv"><div class="kv-label">코드</div><div class="kv-code">${esc(code)}</div></div>` : ""}
        ${fix  ? `<div class="kv"><div class="kv-label" style="color:#4caf50">수정 방법</div><div class="kv-code" style="border-left:2px solid #4caf50">${esc(fix)}</div></div>` : ""}
        ${cwe  ? `<div class="kv"><div class="kv-label">CWE</div><div class="kv-value">${esc(cwe)}</div></div>` : ""}
        ${owasp? `<div class="kv"><div class="kv-label">OWASP</div><div class="kv-value">${esc(owasp)}</div></div>` : ""}
      </div>
    </div>`;
  }

  // 8주차: 사이드바 위험 점수 뱃지
  function riskBadge(item) {
    const score = item.risk_score;
    if (score === undefined || score === null) return "";
    let cls, label;
    if (score >= 70)      { cls = "r-high";   label = `위험 ${score}`; }
    else if (score >= 40) { cls = "r-medium";  label = `주의 ${score}`; }
    else if (score >= 10) { cls = "r-low";     label = `낮음 ${score}`; }
    else                  { cls = "r-safe";    label = `안전 ${score}`; }
    return `<div class="apk-item-risk ${cls}">${label}</div>`;
  }

  // 8주차: 위험 점수 게이지 렌더
  function renderRiskGauge(result) {
    const score = result.risk_score;
    if (score === undefined || score === null) return "";
    const h = result.risk_high   || 0;
    const m = result.risk_medium || 0;
    const l = result.risk_low    || 0;
    let cls;
    if (score >= 70)      cls = "score-high";
    else if (score >= 40) cls = "score-medium";
    else if (score >= 10) cls = "score-low";
    else                  cls = "score-safe";
    return `
    <div class="risk-gauge-wrap">
      <div class="risk-gauge-header">
        <span class="risk-gauge-label">RISK SCORE</span>
        <span class="risk-gauge-score ${cls}">${score}<span style="font-size:14px;color:var(--text-dim)">/100</span></span>
      </div>
      <div class="risk-gauge-track">
        <div class="risk-gauge-fill ${cls}" style="width:${score}%"></div>
      </div>
      <div class="risk-gauge-chips">
        <span class="risk-chip risk-chip-H">HIGH ×${h}</span>
        <span class="risk-chip risk-chip-M">MEDIUM ×${m}</span>
        <span class="risk-chip risk-chip-L">LOW ×${l}</span>
      </div>
    </div>`;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ─── 초기화 ──────────────────────────────────────────────
  window.addEventListener("load", async () => {
    setStatus("idle");
    try { await fetchStatus(); } catch(_) {}
    await loadAnalysisList();
  });
</script>
</body>
</html>
