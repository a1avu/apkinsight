<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f1f3f6;font-family:'Inter',system-ui,sans-serif;color:#1e293b;min-height:100vh;font-size:13px}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:#f0f2f5}
  ::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:3px}

  /* Ring */
  .ring-fg{stroke-dashoffset:289;animation:ring .9s cubic-bezier(.4,0,.2,1) forwards;filter:drop-shadow(0 0 5px rgba(220,38,38,.35))}
  @keyframes ring{to{stroke-dashoffset:var(--o)}}

  /* Card */
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);border:1px solid #e5eaf2}

  /* Nav */
  .nav-link{padding:6px 13px;border-radius:6px;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;transition:.15s;text-decoration:none;letter-spacing:.01em}
  .nav-link:hover{background:#f1f5f9;color:#334155}
  .nav-link.active{background:#e8f0fe;color:#1d4ed8;font-weight:600}

  /* Badges */
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:5px;letter-spacing:.04em;white-space:nowrap;display:inline-block}
  .badge-high{background:#ffedd5;color:#c2410c}
  .badge-medium{background:#fef3c7;color:#92400e}
  .badge-low{background:#dcfce7;color:#166534}
  .badge-info{background:#e0f2fe;color:#075985}

  /* Stat cards */
  .stat-card{border-radius:10px;padding:14px 13px;border:1px solid;position:relative;overflow:hidden;height:100%;box-sizing:border-box;}
  .sc-high{background:linear-gradient(135deg,#fff7ed 0%,#fff3e4 100%);border-color:#fbbf7a}
  .sc-medium{background:linear-gradient(135deg,#fffbeb 0%,#fef9d9 100%);border-color:#fcd34d}
  .sc-low{background:linear-gradient(135deg,#f0fdf4 0%,#e8faf0 100%);border-color:#86efac}
  .sc-tp{background:linear-gradient(135deg,#faf5ff 0%,#f3e8ff 100%);border-color:#d8b4fe}

  /* Tables */
  .tbl-th{padding:8px 12px;text-align:left;font-size:10.5px;font-weight:700;color:#64748b;letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
  .tbl-td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;font-size:12px}
  .tbl-row:hover td{background:#f8fafc}

  /* Buttons */
  .btn-primary{background:#1d4ed8;color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:5px}
  .btn-primary:hover{background:#1e40af}
  .btn-soft{background:#f8fafc;color:#475569;border:1px solid #e2e8f0;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:5px}
  .btn-soft:hover{background:#f1f5f9;border-color:#cbd5e0}

  /* Bar */
  .bar-bg{height:10px;background:#f1f5f9;border-radius:6px;overflow:hidden;margin-top:6px}
  .bar-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)}

  /* Page fade */
  body{opacity:0;animation:fadeIn .2s ease forwards}
  body.exit{animation:fadeOut .15s ease forwards}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes fadeOut{to{opacity:0}}

  .threat-card{display:flex;flex-direction:column;height:100%}
  .threat-chart-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:220px;padding:8px 0 12px}
  .threat-chart-svg{width:min(78%,210px);height:auto;display:block;overflow:visible}
  .threat-legend{display:flex;flex-direction:column;gap:8px;margin-top:auto}
  .fill-card{display:flex;flex-direction:column;height:100%}
  .fill-card-body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;height:100%}
  .fill-table-wrap{flex:1;display:flex}
  .fill-table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
  .fill-table tbody tr{height:20%}
  .tbl-row-empty td{color:transparent}
  .tbl-row-empty:hover td{background:transparent}
</style>

<script>
/* ═══════════ Sparkline ═══════════ */
function drawSparkline(id, color, vals) {
  const el = document.getElementById(id);
  if (!el) return;
  const W=70, H=32, mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-((v-mn)/rng)*H*0.78-H*0.08}`).join(' ');
  el.innerHTML = `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* ═══════════ Donut chart ═══════════ */
function drawDonut(segs) {
  const totalEl = document.getElementById('donut-total');
  const svg = document.getElementById('donut-svg');
  if (!totalEl || !svg) return;
  const total = segs.reduce((s,x)=>s+x.v,0);
  totalEl.textContent = total;
  svg.querySelectorAll('.da').forEach(e=>e.remove());
  const cx=75,cy=75,r=56,sw=19, C=2*Math.PI*r;
  let acc=0;
  segs.forEach(s=>{
    if(!s.v){acc+=s.v/total;return;}
    const f=s.v/total;
    const el=document.createElementNS('http://www.w3.org/2000/svg','circle');
    el.setAttribute('cx',cx);el.setAttribute('cy',cy);el.setAttribute('r',r);
    el.setAttribute('fill','none');el.setAttribute('stroke',s.c);el.setAttribute('stroke-width',sw);
    el.setAttribute('stroke-dasharray',`${f*C} ${C}`);
    el.setAttribute('stroke-dashoffset','0');
    el.setAttribute('transform',`rotate(${-90+acc*360},${cx},${cy})`);
    el.classList.add('da');
    svg.appendChild(el);
    acc+=f;
  });
  document.getElementById('donut-legend').innerHTML = segs.map(s=>
    `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:10px;height:10px;border-radius:3px;background:${s.c};flex-shrink:0"></div>
        <span style="font-size:12.5px;color:#475569;font-weight:500">${s.label}</span>
      </div>
      <span style="font-size:12.5px;font-weight:700;color:#334155">${s.v} <span style="font-size:10.5px;color:#94a3b8;font-weight:400">(${total?(s.v/total*100).toFixed(1):0}%)</span></span>
    </div>`).join('');
}

/* ═══════════ TOP 5 bars ═══════════ */
function renderTop5(items) {
  const colors = ['#ef4444','#f97316','#f59e0b','#22c55e','#8b5cf6'];
  const maxCnt = items.length ? Math.max(...items.map(([,c])=>c)) : 1;
  const axisMax = Math.max(Math.ceil(maxCnt / 5) * 5, 5);
  const LW = 148; // label column width px

  const rows = items.map(([name,cnt,pct],i) => {
    const barW = Math.round(cnt / axisMax * 100);
    return `<div style="display:flex;align-items:center;gap:10px;flex:1;min-height:58px;padding:4px 0">
      <div style="width:${LW}px;flex-shrink:0;display:flex;align-items:center;gap:9px">
        <div style="width:14px;height:14px;border-radius:4px;background:${colors[i]};flex-shrink:0;margin-top:1px;align-self:flex-start"></div>
        <span style="font-size:12.5px;color:#334155;font-weight:500;line-height:1.4;word-break:break-word">${name}</span>
      </div>
      <div style="flex:1;height:30px;background:#eef2ff;border-radius:999px;overflow:hidden;min-width:0">
        <div style="width:${barW}%;height:100%;border-radius:999px;background:${colors[i]};transition:width .8s cubic-bezier(.4,0,.2,1)"></div>
      </div>
      <span style="width:28px;font-size:16px;font-weight:800;color:#0f172a;text-align:right;flex-shrink:0">${cnt}</span>
      <span style="width:52px;font-size:12px;color:#94a3b8;flex-shrink:0">(${pct})</span>
    </div>`;
  }).join('');

  const step = axisMax <= 10 ? Math.ceil(axisMax/2) : 5;
  const tickVals = [];
  for(let v=0; v<=axisMax; v+=step) tickVals.push(v);
  if(tickVals[tickVals.length-1]!==axisMax) tickVals.push(axisMax);
  const ticks = tickVals.map((v,j,a) => {
    const pos = v / axisMax * 100;
    const style = j===0 ? 'left:0' : j===a.length-1 ? 'right:0' : `left:${pos}%;transform:translateX(-50%)`;
    return `<span style="position:absolute;${style};top:7px;font-size:11.5px;color:#94a3b8">${v}</span>`;
  }).join('');

  const axis = `<div style="display:flex;gap:10px;margin-top:auto;padding-top:8px">
    <div style="width:${LW}px;flex-shrink:0"></div>

/* ═══════════ OWASP 색상 팔레트 (M1~M10) ═══════════ */
const OWASP_PALETTE=['#f97316','#06b6d4','#8b5cf6','#ef4444','#3b82f6','#ec4899','#64748b','#f59e0b','#22c55e','#14b8a6'];
let _owaspChart=null;

/* ═══════════ OWASP 도넛 차트 ═══════════ */
function drawOWASPDoughnut(items){
  const canvas=document.getElementById('owasp-doughnut');
  if(!canvas)return;

  const total=items.reduce((s,[,c])=>s+c,0);
  const totalEl=document.getElementById('owasp-total');
  if(totalEl)totalEl.textContent=total||'-';

  const bgColors=items.map(([,c],i)=>c>0?OWASP_PALETTE[i%OWASP_PALETTE.length]:'#e2e8f0');

  if(_owaspChart){_owaspChart.destroy();_owaspChart=null;}

  _owaspChart=new Chart(canvas,{
    type:'doughnut',
    data:{
      labels:items.map(([l])=>l),
      datasets:[{
        data:items.map(([,c])=>c>0?c:0),
        backgroundColor:bgColors,
        borderColor:'#ffffff',
        borderWidth:3,
        hoverOffset:10,
        hoverBorderWidth:3,
      }]
    },
    options:{
      cutout:'60%',
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:ctx=>{
              if(!items[ctx.dataIndex])return'';
              const[,c,p]=items[ctx.dataIndex];
              return` ${ctx.label.replace(/^M\d+:\s*/,'')} : ${c} (${p})`;
            }
          },
          bodyFont:{family:'Inter',size:12},
          titleFont:{family:'Inter',weight:'700',size:12},
          padding:10,
          backgroundColor:'#ffffff',
          bodyColor:'#334155',
          titleColor:'#0f172a',
          borderColor:'#e2e8f0',
          borderWidth:1,
        }
      },
      animation:{duration:650,easing:'easeInOutQuart'}
    }
  });

  /* 범례 리스트: 개수 많은 순 정렬, 0은 흐리게 */
  const sorted=[...items.map(([l,c,p],i)=>({l,c,p,i}))].sort((a,b)=>b.c-a.c);
  const listEl=document.getElementById('owasp-list');
  if(!listEl)return;
  listEl.innerHTML=sorted.map(({l,c,p,i})=>{
    const mNum=l.match(/^(M\d+)/)?.[1]||'';
    const short=l.replace(/^M\d+:\s*/,'');
    return`<div style="display:flex;align-items:center;gap:8px;">
      <div style="width:9px;height:9px;border-radius:50%;background:${OWASP_PALETTE[i%OWASP_PALETTE.length]};flex-shrink:0"></div>
      <span style="font-size:10.5px;color:#64748b;font-weight:700;flex-shrink:0;min-width:26px">${mNum}</span>
      <span style="font-size:11px;color:#334155;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(short)}">${esc(short)}</span>
      <span style="font-size:12px;font-weight:700;color:#0f172a;flex-shrink:0;min-width:20px;text-align:right">${c}</span>
      <span style="font-size:10.5px;color:#94a3b8;flex-shrink:0;min-width:44px;text-align:right">${p}</span>
    </div>`;
  }).join('');
}

/* ═══════════ API loading ═══════════ */
function getApiBase(){try{const s=JSON.parse(localStorage.getItem('apkscan_settings')||'{}');return s.apiBase||'http://localhost:8000';}catch(e){return'http://localhost:8000';}}
let analysisData=null;

async function loadDashboard(){
  const params=new URLSearchParams(location.search);
  let id=params.get('id')||sessionStorage.getItem('apkscan_latest_id');

  let listEntry=null;
  try{
    const list=await fetch(getApiBase()+'/analysis/list').then(r=>r.json());
    if(!id&&list.length>0) id=list[0].id;
    listEntry=list.find(e=>String(e.id)===String(id))||(list[0]||null);
  }catch(e){}

  if(id){
    try{
      const [detail, osvData]=await Promise.all([
        fetch(getApiBase()+'/analysis/'+id).then(r=>r.json()),
        fetch(getApiBase()+'/analysis/'+id+'/osv').then(r=>r.json()).catch(()=>null)
      ]);
      if(!detail.error){
        // DB의 사전계산 위험 점수/카운트를 detail에 병합
        if(listEntry){
          detail.risk_score  =listEntry.risk_score;
          detail.risk_high   =listEntry.risk_high;
          detail.risk_medium =listEntry.risk_medium;
          detail.risk_low    =listEntry.risk_low;
        }
        analysisData=detail;
        renderFromApi(detail,osvData);
        return;
      }
    }catch(e){}
  }
}

/* ═══════════ Render: API data ═══════════ */
function renderFromApi(data, osvData){
  // ── APK 메타 ──
  document.getElementById('meta-apk-name').textContent=data.apk_name||'-';
  document.getElementById('meta-version').textContent=data.package_name?`(${data.package_name})`:'';
  if(data.created_at) document.getElementById('meta-date').textContent=new Date(data.created_at).toLocaleString('ko-KR');

  const all=data.results||[];
  const own=all.filter(r=>!r.is_third_party);

  // ── DB 사전계산 카운트 우선 사용, 없으면 직접 카운트 ──
  const sevOrd={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,INFO:4};
  const highCnt  =data.risk_high   ??own.filter(r=>(r.risk||'').toUpperCase()==='HIGH').length;
  const mediumCnt=data.risk_medium ??own.filter(r=>(r.risk||'').toUpperCase()==='MEDIUM').length;
  const lowCnt   =data.risk_low    ??own.filter(r=>['LOW','INFO'].includes((r.risk||'').toUpperCase())).length;

  const libs    =(osvData&&osvData.libs)||[];
  const osv     =(osvData&&osvData.osv)||{findings:[],warnings:[]};
  const tpCnt   =libs.length||all.filter(r=>r.is_third_party).length;

  // ── 통계 카드 ──
  document.getElementById('stat-high').textContent   =highCnt;
  document.getElementById('stat-medium').textContent =mediumCnt;
  document.getElementById('stat-low').textContent    =lowCnt;
  document.getElementById('stat-tp').textContent     =tpCnt;

  drawSparkline('spark-high',  '#ea580c',[3,5,4,6,5,7,highCnt]);
  drawSparkline('spark-medium','#ca8a04',[15,13,14,12,15,12,mediumCnt]);
  drawSparkline('spark-low',   '#16a34a',[22,24,26,23,27,26,lowCnt]);
  drawSparkline('spark-tp',    '#7c3aed',[20,21,22,22,23,24,tpCnt]);

  // ── 위험 점수 링 ──
  const score=data.risk_score??Math.min(100,highCnt*10+mediumCnt*5+lowCnt);
  setRiskScore(score);

  // ── 취약점 유형 TOP 5 (자체 코드만) ──
  const catMap={};
  own.forEach(r=>{const c=r.category||'unknown';catMap[c]=(catMap[c]||0)+1;});
  const top5=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const totOwn=own.length||1;
  renderTop5(top5.map(([n,c])=>[catLabel(n),c,(c/totOwn*100).toFixed(1)+'%']));

  // ── OWASP 분포 (자체 코드만, 2024 기준 정규화) ──
  const owMap={};
  own.forEach(r=>{const o=normalizeOwasp(r.owasp||'Unknown');owMap[o]=(owMap[o]||0)+1;});
  const owTotal=Object.values(owMap).reduce((s,v)=>s+v,0)||1;
  // M 번호 기준 오름차순 정렬 (M1→M10), 같은 번호끼리는 count 내림차순
  const OWASP_ALL=[['M1','M1: Improper Credential Usage'],['M2','M2: Inadequate Supply Chain Security'],['M3','M3: Insecure Authentication/Authorization'],['M4','M4: Insufficient Input/Output Validation'],['M5','M5: Insecure Communication'],['M6','M6: Inadequate Privacy Controls'],['M7','M7: Insufficient Binary Protections'],['M8','M8: Security Misconfiguration'],['M9','M9: Insecure Data Storage'],['M10','M10: Insufficient Cryptography']];
  renderOwaspList(OWASP_ALL.map(([m,label])=>{const cnt=Object.entries(owMap).filter(([k])=>k.startsWith(m+':')||k===label).reduce((s,[,v])=>s+v,0);return[label,cnt,(cnt/owTotal*100).toFixed(1)+'%'];}));

  // ── 발견된 취약점 테이블 (자체 코드, 위험도순) ──
  const sortedOwn=[...own].sort((a,b)=>(sevOrd[(a.risk||'LOW').toUpperCase()]??4)-(sevOrd[(b.risk||'LOW').toUpperCase()]??4));
  const scanDate=data.created_at?new Date(data.created_at).toLocaleDateString('ko-KR'):'-';
  renderRecentVulns(sortedOwn.slice(0,5).map(v=>({
    risk:(v.risk||'LOW').toUpperCase(),
    cwe:v.cwe||'-',
    name:catLabel(v.category||'-'),
    loc:(v.file_path||'-').split(/[\\/]/).pop()+(v.line?':'+v.line:''),
    date:scanDate
  })));

  // ── 써드파티 테이블 (OSV libs 우선) ──
  if(libs.length>0){
    const cveLibMap=new Map();
    (osv.findings||[]).forEach(f=>{
      const prev=cveLibMap.get(f.library);
      if(!prev||(sevOrd[f.severity]??4)<(sevOrd[prev]??4)) cveLibMap.set(f.library,f.severity);
    });
    const warnSet=new Set((osv.warnings||[]).map(w=>w.library));
    const iconColors=['#3b82f6','#22c55e','#f97316','#06b6d4','#8b5cf6','#ec4899','#14b8a6','#f59e0b'];
    const sortedLibs=[...libs].sort((a,b)=>{
      const ra=cveLibMap.has(a.name)?(sevOrd[cveLibMap.get(a.name)]??3):(warnSet.has(a.name)?4:5);
      const rb=cveLibMap.has(b.name)?(sevOrd[cveLibMap.get(b.name)]??3):(warnSet.has(b.name)?4:5);
      return ra-rb;
    });
    renderTpLibs(sortedLibs.slice(0,5).map((l,i)=>({
      name:l.name,
      version:l.version||'미확인',
      risk:cveLibMap.get(l.name)||(warnSet.has(l.name)?'MEDIUM':'LOW'),
      color:iconColors[i%iconColors.length]
    })));
  } else {
    // fallback: is_third_party 결과에서 추출
    const tp=all.filter(r=>r.is_third_party);
    const libMap={};
    tp.forEach(item=>{
      const fp=item.file_path||'';const parts=fp.split(/[\\/]/);
      let lib='unknown';
      for(let i=0;i<parts.length;i++){if(['androidx','com','io','org','okhttp3','retrofit2','kotlin','kotlinx'].includes(parts[i])&&parts[i+1]){lib=parts[i]+'.'+parts[i+1];break;}}
      const risk=(item.risk||'LOW').toUpperCase();
      if(!libMap[lib])libMap[lib]={name:lib,version:'-',risk,color:'#6366f1'};
      else{if((sevOrd[risk]??4)<(sevOrd[libMap[lib].risk]??4))libMap[lib].risk=risk;}
    });
    renderTpLibs(Object.values(libMap).sort((a,b)=>(sevOrd[a.risk]??4)-(sevOrd[b.risk]??4)).slice(0,5));
  }

  // ── 분석 요약 (DB에 있는 정보로 재구성) ──
  const cveCount=(osv.findings||[]).length;
  const warnCount=(osv.warnings||[]).length;
  const summaryRows=[
    {icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z', label:'패키지명',   val:data.package_name||'-'},
    {icon:'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4',                                                                                     label:'취약점 (자체)', val:own.length+'건'},
    {icon:'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10',                                                                       label:'라이브러리',  val:tpCnt+'개'},
    {icon:'M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z',                        label:'CVE 확인',   val:cveCount>0?`${cveCount}건`:'없음'},
    {icon:'M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z',                        label:'버전 미확인', val:warnCount>0?`${warnCount}건`:'없음'},
    {icon:'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z', label:'위험 점수', val:score+'점'},
  ];
  document.getElementById('summary-list').innerHTML=summaryRows.map((r,i)=>{
    const isPackage=r.label==='패키지명';
    const valColor=isPackage?'#1d4ed8':'#334155';
    const valSize=isPackage?'11px':'13px';
    const valBreak=isPackage?'word-break:break-all;text-align:right;max-width:140px;white-space:normal;line-height:1.4':'';
    return`<div style="display:flex;align-items:${isPackage?'flex-start':'center'};justify-content:space-between;padding-bottom:${i<summaryRows.length-1?'10px':'0'};${i<summaryRows.length-1?'border-bottom:1px solid #f8fafc;':''}">
      <div style="display:flex;align-items:center;gap:9px;flex-shrink:0">
        <div style="width:26px;height:26px;background:#f1f5f9;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="13" height="13" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${r.icon}"/></svg>
        </div>
        <span style="font-size:12.5px;color:#64748b">${r.label}</span>
      </div>
      <span style="font-size:${valSize};font-weight:700;color:${valColor};${valBreak}">${esc(String(r.val))}</span>
    </div>`;
  }).join('');
}

/* ═══════════ Risk score ring ═══════════ */
function setRiskScore(score){
  const el=document.getElementById('ring-fg');
  const scoreEl=document.getElementById('risk-score');
  const offset=289-(289*score/100);
  el.style.setProperty('--o',offset);
  scoreEl.textContent=score;
  let color,label,desc;
  if(score>=65){color='#dc2626';label='위험';desc='앱 보안 상태가 위험합니다.<br>즉시 개선이 필요합니다.';}
  else if(score>=40){color='#ea580c';label='중간 위험';desc='일부 취약점 개선이 필요합니다.';}
  else{color='#16a34a';label='양호';desc='보안 상태가 양호합니다.';}
  el.setAttribute('stroke',color);
  scoreEl.style.color=color;
  document.getElementById('risk-label').textContent=label;
  document.getElementById('risk-label').style.color=color;
  document.getElementById('risk-desc').innerHTML=desc;
}

/* ═══════════ Helpers ═══════════ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function catLabel(c){const m={android_certificate_pinning:'인증서 피닝 미적용',android_certificate_transparency:'인증서 투명성 미적용',android_detect_tapjacking:'탭재킹 방어 미적용',android_prevent_screenshot:'스크린샷 방지 미적용',android_root_detection:'루팅 감지 미적용',android_safetynet_api:'SafetyNet API 미사용',log_sensitive_info:'민감한 정보 노출',debug_stacktrace:'디버그 스택트레이스',hardcoded_secret:'하드코딩된 비밀값',insecure_random:'안전하지 않은 난수',weak_crypto:'취약한 암호화',sql_injection:'SQL 인젝션',dynamic_code_loading:'동적 코드 로딩',reflection_usage:'리플렉션 사용',dynamic_broadcast_receiver:'동적 브로드캐스트 리시버',insecure_http:'비보안 HTTP 사용'};return m[c]||c;}

// OWASP Mobile Top 10 2016 → 2024 정규화
// mobsfscan 등 도구가 2016 이름을 출력하므로 프론트에서 2024 기준으로 통일
function normalizeOwasp(raw) {
  if (!raw) return 'Unknown';
  const map2016to2024 = {
    'M1: Improper Platform Usage':   'M4: Insufficient Input/Output Validation',
    'M2: Insecure Data Storage':     'M9: Insecure Data Storage',
    'M3: Insecure Communication':    'M5: Insecure Communication',
    'M4: Insecure Authentication':   'M3: Insecure Authentication/Authorization',
    'M5: Insufficient Cryptography': 'M10: Insufficient Cryptography',
    'M6: Insecure Authorization':    'M3: Insecure Authentication/Authorization',
    'M7: Client Code Quality':       'M4: Insufficient Input/Output Validation',
    'M8: Code Tampering':            'M7: Insufficient Binary Protections',
    'M9: Reverse Engineering':       'M7: Insufficient Binary Protections',
    'M10: Extraneous Functionality': 'M8: Security Misconfiguration',
    // patterns.json 일부 불완전 2016 표기
    'M3: Insecure Authentication':   'M3: Insecure Authentication/Authorization',
  };
  return map2016to2024[raw] || raw;
}
function downloadJSON(){
  if(!analysisData) return;
  const apkName = analysisData.apk_name || 'result';
  const id = analysisData.id;
  // LLM JSON 다운로드
  const llmBlob = new Blob([JSON.stringify(analysisData, null, 2)], {type:'application/json'});
  const llmA = document.createElement('a');
  llmA.href = URL.createObjectURL(llmBlob);
  llmA.download = apkName + '_llm.json';
  llmA.click();
  // OSV JSON 다운로드 (API에서 가져오기)
  if(id) {
    fetch(getApiBase() + '/analysis/' + id + '/osv')
      .then(r => r.json())
      .then(osv => {
        const osvBlob = new Blob([JSON.stringify(osv, null, 2)], {type:'application/json'});
        const osvA = document.createElement('a');
        osvA.href = URL.createObjectURL(osvBlob);
        osvA.download = apkName + '_osv.json';
        setTimeout(() => osvA.click(), 300);
      }).catch(()=>{});
  }
}
async function downloadReport(){
  if(!analysisData) return;
  const id = analysisData.id;
  if(!id){ alert('분석 ID를 찾을 수 없습니다.'); return; }
  try {
    const res = await fetch(getApiBase() + '/report/' + id);
    if(!res.ok) throw new Error('서버 오류');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (analysisData.apk_name || 'report') + '_report.pdf';
    a.click();
  } catch(e) {
    alert('보고서 생성에 실패했습니다: ' + e.message);
  }
}
